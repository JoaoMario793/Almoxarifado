{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px;">
  <h1>{{ titulo }}</h1>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="campo">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for erro in field.errors %}
          <div class="erro-campo">{{ erro }}</div>
        {% endfor %}
      </div>
    {% endfor %}
    <div class="linha-acoes">
      <button type="submit" class="btn">Guardar</button>
      <a href="{% url 'estoque:catalogo' %}" class="btn btn-vermelho">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
